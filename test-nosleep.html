<script>
(function () {
  var v = document.getElementById('nosleep');
  var elState = document.getElementById('vstate');
  var elTime = document.getElementById('vtime');
  var elIdle = document.getElementById('idle');
  var elClock = document.getElementById('clock');
  var elMode = document.getElementById('mode');
  var elLog = document.getElementById('log');

  var wanted = false;          // czy wideo ma grac
  var playedSeconds = 0;       // licznik: ile sekund faktycznie gralo
  var lastT = -1;
  var lastTouch = Date.now();
  var lastTick = Date.now();

  v.muted = true;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hms(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function log(msg) {
    var p = document.createElement('div');
    p.innerHTML = hms(new Date()) + ' — ' + msg;
    elLog.insertBefore(p, elLog.firstChild);
  }

  function setState() {
    if (!v.paused) { elState.innerHTML = 'gra'; elState.className = 'ok'; }
    else { elState.innerHTML = 'zatrzymane'; elState.className = 'bad'; }
  }

  function start() {
    wanted = true;
    var p;
    try { p = v.play(); } catch (e) { log('Błąd play(): ' + e.message); }
    if (p && typeof p.then === 'function') {
      p.then(function () { log('Wideo start'); setState(); },
             function (e) { log('Autostart zablokowany — stuknij „Włącz wideo”'); setState(); });
    } else {
      log('Wideo start (bez Promise)');
    }
  }

  function stop() {
    wanted = false;
    v.pause();
    log('Wideo stop — ekran powinien zgasnąć po ~5 min bez dotyku');
    setState();
  }

  // Zabezpieczenie, gdyby loop nie zadzialal
  v.addEventListener('ended', function () { if (wanted) { v.currentTime = 0; v.play(); } }, false);
  v.addEventListener('play', setState, false);
  v.addEventListener('pause', setState, false);

  document.getElementById('bStart').addEventListener('click', start, false);
  document.getElementById('bStop').addEventListener('click', stop, false);

  function touched() { lastTouch = Date.now(); }
  document.addEventListener('touchstart', touched, false);
  document.addEventListener('mousedown', touched, false);

  elMode.innerHTML = window.navigator.standalone ? 'ikona na ekranie głównym (pełny ekran)' : 'Safari';

  setInterval(function () {
    var now = Date.now();

    // Wykrycie wybudzenia: przerwa w tykaniu = ekran byl zgaszony
    var gap = now - lastTick;
    if (gap > 15000) {
      log('Powrót po przerwie ' + Math.round(gap / 60000 * 10) / 10 +
          ' min. Ekran zgasł ok. ' + hms(new Date(lastTick)));
      if (wanted && v.paused) { log('Wideo stoi po wybudzeniu — wznawiam'); start(); }
    }
    lastTick = now;

    // Czy filmik faktycznie leci
    if (!v.paused && v.currentTime !== lastT) { playedSeconds++; }
    lastT = v.currentTime;
    elTime.innerHTML = playedSeconds;

    var idle = Math.floor((now - lastTouch) / 1000);
    elIdle.innerHTML = Math.floor(idle / 60) + ':' + pad(idle % 60);
    elClock.innerHTML = hms(new Date(now));
    setState();
  }, 1000);

  log('Strona załadowana');
  start(); // proba autostartu (bez dotyku)
})();
</script>
