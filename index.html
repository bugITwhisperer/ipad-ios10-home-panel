<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Panel</title>
<style>
html, body {
  margin: 0; padding: 0; height: 100%;
  background-color: #10161f;
  color: #e8eef6;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  overflow: hidden;
}

#app { box-sizing: border-box; height: 100%; padding: 20px 26px 14px 26px; }

/* ---------- top bar ---------- */
.top {
  display: -webkit-box; display: flex;
  -webkit-box-align: start; align-items: flex-start;
  -webkit-box-pack: justify; justify-content: space-between;
}
.place { font-size: 22px; font-weight: 300; letter-spacing: 0.12em; color: #7d92ab; margin: 0 0 2px 0; }
.stamp { font-size: 15px; color: #56687d; margin: 0; }

/* ---------- view tabs ---------- */
#tabs { display: -webkit-box; display: flex; }
#topright { display: -webkit-box; display: flex; }
.tab {
  font-size: 17px; color: #6f8299;
  padding: 8px 15px; margin-left: 7px;
  background-color: #17202c; border-radius: 7px;
  border-top: 2px solid #2b3a4d;
}
.tab.on { color: #e8eef6; border-top-color: #ffc46b; background-color: #1d2735; }

#mini {
  display: none;
  font-size: 21px; font-weight: 300; color: #b9c9db;
  margin-top: 11px; white-space: nowrap;
}
#mini.on { display: inline; }
#mini i { font-style: normal; font-size: 24px; margin-right: 8px; }
#mini b { font-weight: 400; color: #ffc46b; font-size: 27px; margin-right: 10px; }
#mini u { text-decoration: none; color: #7d92ab; font-size: 17px; margin-left: 10px; }

select {
  font-family: inherit; font-size: 15px; color: #b9c9db;
  background-color: #1a2330; border: 1px solid #2b3a4d;
  border-radius: 6px; padding: 4px 7px;
  -webkit-appearance: none; appearance: none;
  min-width: 0; width: auto; margin-top: 7px;
}
select.off { display: none; }

/* ---------- views ---------- */
.view { display: none; }
.view.on { display: block; }

/* ---------- weather ---------- */
.now { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; margin: 12px 0 34px 0; }
.now-icon { font-size: 66px; line-height: 1; margin-right: 22px; }
.now-temp { font-size: 88px; font-weight: 200; line-height: 0.92; color: #ffc46b; margin-right: 26px; }
.now-text { font-size: 28px; font-weight: 300; line-height: 1.35; color: #b9c9db; }
.now-text span { color: #7d92ab; font-size: 21px; }

#strip-today, #strip-next { display: -webkit-box; display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
.cell {
  -webkit-box-flex: 1; flex: 1 0 auto; min-width: 104px;
  text-align: center; padding: 16px 9px 18px 9px; margin-right: 10px;
  background-color: #17202c; border-radius: 9px; border-top: 2px solid #2b3a4d;
}
.cell:last-child { margin-right: 0; }
.cell.edge { border-top-color: #ffc46b; }
.c-when { font-size: 19px; line-height: 1.1; color: #8fa3b8; margin-bottom: 10px; }
.c-icon { font-size: 34px; line-height: 1; margin-bottom: 10px; }
.c-temp { font-size: 31px; line-height: 1.05; font-weight: 300; color: #ffc46b; margin-bottom: 2px; }
.c-lo { font-size: 22px; line-height: 1.05; color: #6f8299; margin-bottom: 8px; }
.c-rain { font-size: 18px; line-height: 1.15; color: #6fb6f0; margin-bottom: 5px; }
.c-wind { font-size: 18px; line-height: 1.15; color: #7d92ab; }

/* ---------- stubs ---------- */
.stub { margin-top: 40px; font-size: 24px; font-weight: 300; line-height: 1.6; color: #6f8299; }
.stub b { display: block; font-weight: 400; font-size: 30px; color: #b9c9db; margin-bottom: 10px; }

.strip-head {
  font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #6f8299; margin: 34px 0 12px 0;
}
.msg { margin-top: 30px; font-size: 22px; font-weight: 300; line-height: 1.5; color: #8fa3b8; }
.msg b { display: block; font-weight: 400; color: #e8eef6; margin-bottom: 6px; }

/* ---------- Zakupy/ToDo ---------- */
.cols { display: -webkit-box; display: flex; margin-top: 16px; }
/* width:0 + basis 0%: iOS 10 Safari ignores a bare 0 and lets long text widen the column */
.col {
  -webkit-box-flex: 1; flex: 1 1 0%; width: 0; min-width: 0; margin-right: 22px;
  max-height: 560px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.col:last-child { margin-right: 0; }
.col-head {
  font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #6f8299; margin: 0 0 10px 0;
}
.item {
  font-size: 28px; font-weight: 300; color: #e8eef6;
  padding: 12px 14px; margin-bottom: 8px;
  background-color: #17202c; border-radius: 9px; border-left: 3px solid #2b3a4d;
  white-space: normal; word-wrap: break-word; line-height: 1.25;
}
.item.done { color: #56687d; text-decoration: line-through; border-left-color: #ffc46b; }
.more { font-size: 21px; color: #ffc46b; padding: 10px 14px; }
.empty { font-size: 22px; color: #56687d; margin: 6px 0; }
.list-note { font-size: 17px; color: #ffc46b; margin: 10px 0 0 0; }
.list-foot { margin-top: 14px; font-size: 15px; }
.link { color: #56687d; text-decoration: underline; }
#setup.off { display: none; }
#setup input {
  box-sizing: border-box; width: 100%;
  font-family: inherit; font-size: 18px; color: #e8eef6;
  background-color: #1a2330; border: 1px solid #2b3a4d; border-radius: 6px;
  padding: 10px; margin: 14px 0 12px 0;
  -webkit-user-select: text; user-select: text;
}
.btn {
  display: inline-block; font-size: 20px; color: #e8eef6;
  padding: 10px 22px; margin-right: 10px;
  background-color: #1d2735; border-radius: 7px; border-top: 2px solid #ffc46b;
}

/* ---------- light theme: grey, easier on an old LCD than white ---------- */
body.light { background-color: #d9dde2; color: #23303f; }
body.light .place { color: #5a6b7e; }
body.light .stamp { color: #7d8b9a; }
body.light .tab { background-color: #c8ced6; color: #5a6b7e; border-top-color: #b0b9c4; }
body.light .tab.on { background-color: #eceef1; color: #23303f; border-top-color: #b8720f; }
body.light select { background-color: #c8ced6; color: #23303f; border-color: #aab3bf; }
body.light .now-temp { color: #b8720f; }
body.light .now-text { color: #3d4d5e; }
body.light .now-text span { color: #6b7a8a; }
body.light .strip-head { color: #6b7a8a; }
body.light .cell { background-color: #eceef1; border-top-color: #b0b9c4; }
body.light .cell.edge { border-top-color: #b8720f; }
body.light .c-when { color: #5a6b7e; }
body.light .c-temp { color: #b8720f; }
body.light .c-lo { color: #7d8b9a; }
body.light .c-rain { color: #1c6ba8; }
body.light .c-wind { color: #5a6b7e; }
body.light .stub { color: #5a6b7e; }
body.light .stub b { color: #23303f; }
body.light .msg { color: #4a5a6b; }
body.light .msg b { color: #23303f; }
body.light #mini { color: #3d4d5e; }
body.light #mini b { color: #b8720f; }
body.light #mini u { color: #6b7a8a; }
body.light .col-head { color: #6b7a8a; }
body.light .item { background-color: #eceef1; color: #23303f; border-left-color: #b0b9c4; }
body.light .item.done { color: #8a96a3; border-left-color: #b8720f; }
body.light .more { color: #b8720f; }
body.light .empty { color: #7d8b9a; }
body.light .list-note { color: #9a5a00; }
body.light .link { color: #6b7a8a; }
body.light #setup input { background-color: #eceef1; color: #23303f; border-color: #aab3bf; }
body.light .btn { background-color: #c8ced6; color: #23303f; border-top-color: #b8720f; }
body.light #theme { background-color: #c8ced6; border-top-color: #b0b9c4; }

/* ---------- theme toggle ---------- */
#theme {
  font-size: 21px; line-height: 1;
  padding: 9px 13px; margin-left: 7px;
  background-color: #17202c; border-radius: 7px;
  border-top: 2px solid #2b3a4d;
}

/* ---------- night ---------- */
#night {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-color: #000;
  display: none;
}
#night.on { display: block; }
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div>
      <p class="place" id="place">Lublin</p>
      <p class="stamp" id="stamp">Wczytywanie...</p>
      <span id="mini"></span>
      <select id="range">
        <option value="tomorrow">Jutro</option>
        <option value="3">3 dni</option>
        <option value="5">5 dni</option>
        <option value="7">7 dni</option>
      </select>
    </div>
    <div id="topright">
      <div id="tabs"></div>
      <div id="theme"></div>
    </div>
  </div>

  <div class="view" id="view-pogoda">
    <div id="now"></div>
    <p class="strip-head" id="head-today" style="margin-top:0">Dzisiaj</p>
    <div id="strip-today"></div>
    <div id="msg-today"></div>
    <p class="strip-head" id="head-next">Jutro</p>
    <div id="strip-next"></div>
  </div>

  <div class="view" id="view-lista">
    <div id="setup" class="off">
      <p class="msg"><b>Pod&#322;&#261;cz arkusz Zakupy/ToDo</b>Wklej adres skryptu razem z kluczem:<br>https://script.google.com/macros/s/&hellip;/exec?key=&hellip;</p>
      <input id="setup-url" type="url" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="btn" data-act="save">Zapisz</div><div class="btn" data-act="clear">Wyczy&#347;&#263;</div>
      <p class="list-note" id="setup-err"></p>
    </div>
    <div id="lista"></div>
  </div>

  <div class="view" id="view-kalendarz">
    <p class="stub"><b>Kalendarz</b>Etap B &mdash; wydarzenia na dzi&#347; ze wsp&#243;lnego kalendarza.</p>
  </div>
</div>

<div id="night"></div>

<script>
var LAT = 51.2465;
var LON = 22.5684;

var API = "https://api.open-meteo.com/v1/forecast" +
  "?latitude=" + LAT + "&longitude=" + LON +
  "&current=temperature_2m,weather_code,wind_speed_10m,precipitation" +
  "&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m" +
  "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
  "precipitation_probability_max,wind_speed_10m_max,sunrise,sunset" +
  "&timezone=Europe%2FWarsaw&forecast_days=8";

var DNI = ["niedziela", "poniedzia\u0142ek", "wtorek", "\u015broda",
           "czwartek", "pi\u0105tek", "sobota"];

/* rotation plan: weather gets half the loop */
var VIEWS = [
  { id: "pogoda",    label: "Pogoda",       ms: 600000 },
  { id: "lista",     label: "Zakupy/ToDo",  ms: 300000 },
  { id: "kalendarz", label: "Kalendarz",    ms: 300000 }
];

var PAUSE_MS = 300000;   /* touch in daytime holds the view */
var WAKE_MS  = 30000;    /* touch at night lights the screen */
var DIM_MIN  = 30;       /* screen goes dark at 00:30 */
var DAWN_LEAD_MS = 300000; /* lights up 5 min before sunrise */

var STORAGE_KEY = "gscriptUrl";   /* Web App URL + key, kept only on the device. Do not rename: iPads already set up read it */
var JSONP_TIMEOUT_MS = 15000;
var LIST_MAX_ROWS = 7;            /* per column before "+N wiecej" */
var LISTS = [
  { id: "zakupy", label: "Zakupy" },
  { id: "todo",   label: "ToDo" }
];

/* ---------- weather logic (unchanged from v1) ---------- */

function wmo(code) {
  if (code === 0) return { icon: "\u2600\uFE0F", text: "bezchmurnie" };
  if (code === 1) return { icon: "\uD83C\uDF24", text: "prawie bezchmurnie" };
  if (code === 2) return { icon: "\u26C5", text: "cz\u0119\u015bciowe zachmurzenie" };
  if (code === 3) return { icon: "\u2601\uFE0F", text: "pochmurno" };
  if (code === 45 || code === 48) return { icon: "\uD83C\uDF2B", text: "mg\u0142a" };
  if (code >= 51 && code <= 57) return { icon: "\uD83C\uDF26", text: "mrzawka" };
  if (code >= 61 && code <= 65) return { icon: "\uD83C\uDF27", text: "deszcz" };
  if (code === 66 || code === 67) return { icon: "\uD83C\uDF27", text: "marzn\u0105cy deszcz" };
  if (code >= 71 && code <= 77) return { icon: "\u2744\uFE0F", text: "\u015bnieg" };
  if (code >= 80 && code <= 82) return { icon: "\uD83C\uDF26", text: "przelotny deszcz" };
  if (code === 85 || code === 86) return { icon: "\uD83C\uDF28", text: "opady \u015bniegu" };
  if (code >= 95) return { icon: "\u26C8", text: "burza" };
  return { icon: "\uD83C\uDF21", text: "brak danych" };
}

function hhmm(iso) { return iso.slice(11, 16); }

function dayLabel(iso, todayIso) {
  if (iso.slice(0, 10) === todayIso.slice(0, 10)) return "dzisiaj";
  var p = iso.slice(0, 10).split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return DNI[d.getDay()];
}

function round(n) {
  if (n === null || n === undefined || isNaN(n)) return null;
  return Math.round(n);
}

/* daily strip starts at TOMORROW: today already has its own hourly strip above */
function buildDaily(data, count, todayIso) {
  var d = data.daily, out = [], i;
  for (i = 1; i <= count && i < d.time.length; i++) {
    out.push({
      when: dayLabel(d.time[i], todayIso),
      icon: wmo(d.weather_code[i]).icon,
      text: wmo(d.weather_code[i]).text,
      temp: round(d.temperature_2m_max[i]),
      lo: round(d.temperature_2m_min[i]),
      rain: round(d.precipitation_probability_max[i]),
      wind: round(d.wind_speed_10m_max[i]),
      daily: true,
      edge: false
    });
  }
  return out;
}

/* today: from the current hour through 23:00. Past hours are dropped, not dimmed.
   Sunrise/sunset no longer bound this strip - they only drive night mode. */
function buildToday(data, nowIso) {
  var h = data.hourly;
  var day = nowIso.slice(0, 10);
  var fromHour = nowIso.slice(0, 13) + ":00";
  var out = [], i;
  for (i = 0; i < h.time.length; i++) {
    var t = h.time[i];
    if (t.slice(0, 10) !== day) continue;
    if (t < fromHour) continue;
    out.push(hourCell(h, i));
  }
  return out;
}

/* tomorrow: from tomorrow's own sunrise through 23:00 */
function buildTomorrow(data) {
  var h = data.hourly;
  if (!data.daily.sunrise[1]) return [];
  var sunrise = data.daily.sunrise[1];
  var day = sunrise.slice(0, 10);
  var fromHour = sunrise.slice(0, 13) + ":00";
  var out = [], i;
  for (i = 0; i < h.time.length; i++) {
    var t = h.time[i];
    if (t.slice(0, 10) !== day) continue;
    if (t < fromHour) continue;
    out.push(hourCell(h, i));
  }
  return out;
}

function hourCell(h, i) {
  return {
    when: hhmm(h.time[i]),
    icon: wmo(h.weather_code[i]).icon,
    text: wmo(h.weather_code[i]).text,
    temp: round(h.temperature_2m[i]),
    lo: null,
    rain: round(h.precipitation_probability[i]),
    wind: round(h.wind_speed_10m[i]),
    edge: false
  };
}

function msUntil4am(now) {
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0, 0);
  if (t.getTime() <= now.getTime()) {
    t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 4, 0, 0, 0);
  }
  return t.getTime() - now.getTime();
}

/* ---------- night mode ---------- */

function parseLocal(iso) {
  var d = iso.slice(0, 10).split("-");
  var t = iso.slice(11, 16).split(":");
  return new Date(Number(d[0]), Number(d[1]) - 1, Number(d[2]),
                  Number(t[0]), Number(t[1]), 0, 0);
}

/* lights up DAWN_LEAD_MS before whatever sunrise the API reported */
function dawnTime(sunriseIso) {
  return new Date(parseLocal(sunriseIso).getTime() - DAWN_LEAD_MS);
}

function dimStart(now) {
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, DIM_MIN, 0, 0);
}

/* the dark window always belongs to ONE calendar day: 00:30 -> dawn that morning.
   The API's sunrise may carry a different date (cached, or already tomorrow's),
   so only its clock time is used, pinned to the day we are actually in. */
function dawnToday(now, sunriseIso) {
  var t = sunriseIso.slice(11, 16).split(":");
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                   Number(t[0]), Number(t[1]), 0, 0);
  return new Date(d.getTime() - DAWN_LEAD_MS);
}

function isDark(now, sunriseIso) {
  var dawn = dawnToday(now, sunriseIso);
  var dim = dimStart(now);
  if (now.getTime() < dim.getTime()) return false;
  return now.getTime() < dawn.getTime();
}

/* ---------- theme ---------- */

var THEMES = ["dark", "light"];

/* the icon shows what you will GET, not what you have */
function themeIcon(theme) {
  return theme === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
}

function nextTheme(theme) {
  return theme === "light" ? "dark" : "light";
}

/* anything unreadable or unrecognised falls back to dark */
function readTheme(store) {
  var raw;
  try { raw = store ? store.getItem("panel-theme") : null; }
  catch (e) { return "dark"; }
  if (raw === "light" || raw === "dark") return raw;
  return "dark";
}

function saveTheme(store, theme) {
  if (theme !== "light" && theme !== "dark") return false;
  try { store.setItem("panel-theme", theme); return true; }
  catch (e) { return false; }
}

function bodyClass(theme, dark) {
  /* night dims to black on top of whichever theme is set - it never
     replaces it, so the same theme comes back at dawn */
  return theme === "light" ? "light" : "";
}

/* ---------- state machine ---------- */

function createState() {
  return { viewIndex: 0, pausedUntil: 0, wakeUntil: 0, switchAt: 0 };
}

function currentView(state) { return VIEWS[state.viewIndex].id; }

function advance(state) {
  state.viewIndex = (state.viewIndex + 1) % VIEWS.length;
  return VIEWS[state.viewIndex];
}

/* single source of truth for what the screen should be doing right now */
function decide(state, now, sunriseIso) {
  var ms = now.getTime();
  var dark = isDark(now, sunriseIso);
  if (dark) {
    var awake = ms < state.wakeUntil;
    return { view: currentView(state), dark: !awake, rotating: false, night: true };
  }
  var paused = ms < state.pausedUntil;
  return { view: currentView(state), dark: false, rotating: !paused, night: false };
}

/* the ONLY place a view changes on its own. The deadline is set once, when a view
   starts running, and never pushed back by the minute refresh - that was the bug:
   re-arming a full 10-min timer every minute meant it never fired.
   Paused or night -> no deadline; when rotation resumes the view gets its full time.
   Returns true when the view changed. */
function rotate(state, now, rotating) {
  var ms = now.getTime();
  if (!rotating) { state.switchAt = 0; return false; }
  if (!state.switchAt) { state.switchAt = ms + VIEWS[state.viewIndex].ms; return false; }
  if (ms < state.switchAt) return false;
  advance(state);
  state.switchAt = ms + VIEWS[state.viewIndex].ms;
  return true;
}

function onTouch(state, now, sunriseIso) {
  if (isDark(now, sunriseIso)) {
    state.wakeUntil = now.getTime() + WAKE_MS;   /* reset, not extend-by-sum */
  } else {
    state.pausedUntil = now.getTime() + PAUSE_MS;
  }
  return state;
}

function onManualSwitch(state, now, sunriseIso) {
  advance(state);
  return onTouch(state, now, sunriseIso);
}

/* ---------- rendering ---------- */

function cellHtml(c) {
  var s = "";
  s += '<div class="cell' + (c.edge ? " edge" : "") + '"' +
       (c.past ? ' style="opacity:0.42"' : "") + ">";
  s += '<div class="c-when">' + c.when + "</div>";
  s += '<div class="c-icon">' + c.icon + "</div>";
  s += '<div class="c-temp">' + (c.temp === null ? "--" : c.temp + "\u00B0") + "</div>";
  /* only daily cells carry a min temperature; a missing value keeps the row ("--") so all cells stay the same height */
  if (c.daily) s += '<div class="c-lo">' + (c.lo === null ? "--" : c.lo + "\u00B0") + "</div>";
  s += '<div class="c-rain">\uD83D\uDCA7 ' + (c.rain === null ? "--" : c.rain + "%") + "</div>";
  s += '<div class="c-wind">\uD83D\uDCA8 ' + (c.wind === null ? "--" : c.wind + " km/h") + "</div>";
  s += "</div>";
  return s;
}

function nowHtml(data) {
  var c = data.current;
  var w = wmo(c.weather_code);
  var s = '<div class="now">';
  s += '<div class="now-icon">' + w.icon + "</div>";
  s += '<div class="now-temp">' + round(c.temperature_2m) + "\u00B0</div>";
  s += '<div class="now-text">' + w.text + "<br>";
  s += "<span>wiatr " + round(c.wind_speed_10m) + " km/h";
  s += " &nbsp; opad " + c.precipitation + " mm</span>";
  s += "</div></div>";
  return s;
}

/* compact one-line version of the current conditions, for the header.
   Inline elements only - it must never become a second block. */
function miniNowHtml(data) {
  if (!data || !data.current) {
    return "<i>\uD83C\uDF21</i><b>--\u00B0</b>brak danych";
  }
  var c = data.current;
  var w = wmo(c.weather_code);
  var temp = round(c.temperature_2m);
  var wind = round(c.wind_speed_10m);
  var rain = (c.precipitation === null || c.precipitation === undefined)
    ? "--" : c.precipitation;
  return "<i>" + w.icon + "</i>" +
         "<b>" + (temp === null ? "--" : temp) + "\u00B0</b>" +
         w.text +
         "<u>\uD83D\uDCA8 " + (wind === null ? "--" : wind) + " km/h" +
         " &nbsp; \uD83D\uDCA7 " + rain + " mm</u>";
}

function tabsHtml(activeId) {
  var s = "", i;
  for (i = 0; i < VIEWS.length; i++) {
    s += '<div class="tab' + (VIEWS[i].id === activeId ? " on" : "") +
         '" data-view="' + VIEWS[i].id + '">' + VIEWS[i].label + "</div>";
  }
  return s;
}

/* ---------- Zakupy/ToDo: setup ---------- */

function trim(s) {
  return String(s === null || s === undefined ? "" : s).replace(/^\s+|\s+$/g, "");
}

/* a URL never contains whitespace, so any space or line break picked up
   while pasting (mail, notes) is simply dropped */
function compactUrl(s) {
  return String(s === null || s === undefined ? "" : s).replace(/\s+/g, "");
}

/* only the real deployment URL, with its key, and nothing after it */
function isValidExecUrl(s) {
  return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?key=[A-Za-z0-9_-]+$/.test(compactUrl(s));
}

function getSavedUrl(storage) {
  try {
    var v = storage.getItem(STORAGE_KEY);
    return v ? v : null;
  } catch (e) { return null; }
}

function saveUrl(storage, url) {
  try { storage.setItem(STORAGE_KEY, compactUrl(url)); return true; }
  catch (e) { return false; }
}

function initialScreen(storage) {
  var v;
  try { v = storage.getItem(STORAGE_KEY); }
  catch (e) { return "storage-error"; }
  return v && isValidExecUrl(v) ? "panel" : "setup";
}

/* ---------- Zakupy/ToDo: list state ---------- */

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function createListState() {
  return { data: null, offline: false, error: "", message: "",
           pending: {}, expanded: { zakupy: false, todo: false } };
}

/* fetch only on the way INTO the list view, never on the minute refresh */
function needsFetch(prevView, newView) {
  return newView === "lista" && prevView !== "lista";
}

function onFetchResult(ls, res) {
  if (res && res.ok === true) {
    ls.data = { zakupy: res.zakupy || [], todo: res.todo || [] };
    ls.offline = false;
    ls.error = "";
  } else if (res && res.ok === false) {
    ls.error = res.error || "server";
    ls.offline = false;
  } else {
    ls.offline = true;               /* timeout / network: keep the last list */
  }
  return ls;
}

function findItem(ls, list, row) {
  var items = ls.data && ls.data[list], i;
  if (!items) return null;
  for (i = 0; i < items.length; i++) if (items[i].row === row) return items[i];
  return null;
}

/* optimistic: flip at once, one request per item at a time */
function tickStart(ls, list, row) {
  var key = list + ":" + row;
  var it = findItem(ls, list, row);
  if (!it || ls.pending[key]) return { ls: ls, request: null };
  it.done = !it.done;
  ls.pending[key] = true;
  ls.message = "";
  return { ls: ls, request: { tick: list, row: row, done: it.done ? "1" : "0" } };
}

function tickResult(ls, list, row, ok) {
  delete ls.pending[list + ":" + row];
  if (!ok) {
    var it = findItem(ls, list, row);
    if (it) it.done = !it.done;
    ls.message = "Nie uda\u0142o si\u0119 zapisa\u0107 \u2014 spr\u00f3buj jeszcze raz.";
  }
  return ls;
}

function expandList(ls, list) { ls.expanded[list] = true; return ls; }

/* folds back together with the rotation resuming */
function collapseIfIdle(ls, state, now) {
  var i;
  if (now.getTime() < state.pausedUntil) return ls;
  for (i = 0; i < LISTS.length; i++) ls.expanded[LISTS[i].id] = false;
  return ls;
}

function listsHtml(ls, maxRows) {
  var s = "", i, j;
  if (ls.error === "auth") {
    s += '<p class="msg"><b>Z\u0142y klucz</b>Skrypt odrzuci\u0142 klucz. Sprawd\u017a adres w ustawieniach.</p>';
  } else if (ls.error) {
    s += '<p class="list-note">B\u0142\u0105d skryptu: ' + escapeHtml(ls.error) + "</p>";
  }
  if (ls.message) s += '<p class="list-note">' + escapeHtml(ls.message) + "</p>";
  if (ls.offline) s += '<p class="list-note">offline \u2014 pokazuj\u0119 ostatni\u0105 list\u0119</p>';
  if (!ls.data) {
    if (!ls.error) {
      s += ls.offline
        ? '<p class="msg"><b>Brak po\u0142\u0105czenia</b>Lista pobierze si\u0119 przy kolejnym wej\u015bciu.</p>'
        : '<p class="msg">Wczytywanie\u2026</p>';
    }
    return s;
  }
  s += '<div class="cols">';
  for (i = 0; i < LISTS.length; i++) {
    var id = LISTS[i].id;
    var items = ls.data[id] || [];
    var exp = ls.expanded[id];
    var n = exp ? items.length : Math.min(items.length, maxRows);
    s += '<div class="col' + (exp ? " expanded" : "") + '">';
    s += '<p class="col-head">' + LISTS[i].label + "</p>";
    if (items.length === 0) s += '<p class="empty">Pusto</p>';
    for (j = 0; j < n; j++) {
      s += '<div class="item' + (items[j].done ? " done" : "") + '" data-list="' + id +
           '" data-row="' + escapeHtml(items[j].row) + '">' + escapeHtml(items[j].text) + "</div>";
    }
    if (!exp && items.length > maxRows) {
      s += '<div class="more" data-list="' + id + '">+' + (items.length - maxRows) +
           " wi\u0119cej</div>";
    }
    s += "</div>";
  }
  return s + "</div>";
}

/* ---------- Zakupy/ToDo: JSONP transport ----------
   iOS 10 Safari cannot read Apps Script over XHR (CORS), so the answer comes
   back as a script. env = { document, window, setTimeout, clearTimeout }.
   The script tag is removed and the timeout cleared on every outcome. */

var jsonpSeq = 0;

function buildJsonpUrl(base, params, cbName) {
  var s = trim(base), k;
  for (k in params) {
    if (Object.prototype.hasOwnProperty.call(params, k)) {
      s += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    }
  }
  return s + "&callback=" + cbName;
}

function jsonpRequest(env, base, params, onDone) {
  jsonpSeq++;
  var name = "__gs" + jsonpSeq + "_" + new Date().getTime();
  var finished = false, timer = null;
  var tag = env.document.createElement("script");
  function finish(res) {
    if (finished) return;
    finished = true;
    if (timer !== null) env.clearTimeout(timer);
    env.window[name] = function () {};   /* a late answer lands here harmlessly */
    if (tag.parentNode) tag.parentNode.removeChild(tag);
    onDone(res);
  }
  env.window[name] = function (data) { finish(data); };
  tag.onerror = function () { finish({ error: "network" }); };
  timer = env.setTimeout(function () { finish({ error: "timeout" }); }, JSONP_TIMEOUT_MS);
  tag.src = buildJsonpUrl(base, params, name);
  env.document.body.appendChild(tag);
}

/* ---------- wiring ---------- */

if (typeof document !== "undefined") {
  (function () {
    var cache = null;
    var state = createState();
    var store = null;
    try { store = window.localStorage; } catch (e) { store = null; }
    var theme = readTheme(store);
    var rotTimer = null;   /* exactly one rotation timer ever exists */
    var winTimer = null;   /* exactly one pause/wake timer ever exists */
    var retryTimer = null; /* at most one pending weather retry */
    var ls = createListState();
    var lastView = null;
    var listBusy = false;
    var showSetup = false;
    var env = {
      document: document, window: window,
      setTimeout: function (f, ms) { return setTimeout(f, ms); },
      clearTimeout: function (id) { clearTimeout(id); }
    };

    function el(id) { return document.getElementById(id); }

    function localIso() {
      var d = new Date();
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
             "T" + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function sunriseIso() {
      if (cache && cache.daily && cache.daily.sunrise) return cache.daily.sunrise[0];
      var d = new Date();
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T06:00";
    }

    function renderCells(cells) {
      var html = "", i;
      for (i = 0; i < cells.length; i++) html += cellHtml(cells[i]);
      return html;
    }

    function paintWeather() {
      if (!cache) return;
      var nowIso = localIso();

      el("now").innerHTML = nowHtml(cache);

      /* upper strip: today, independent of the dropdown */
      var today = buildToday(cache, nowIso);
      el("strip-today").innerHTML = renderCells(today);
      el("msg-today").innerHTML = today.length === 0
        ? '<p class="msg">Dzi\u015b nie ma ju\u017c pe\u0142nych godzin do pokazania.</p>'
        : "";

      /* lower strip: whatever the dropdown selects */
      var mode = el("range").value;
      var lower, head;
      if (mode === "tomorrow") {
        lower = buildTomorrow(cache);
        head = "Jutro";
      } else {
        lower = buildDaily(cache, Number(mode), nowIso);
        head = "Najbli\u017cszych " + mode + " dni";
      }
      el("head-next").innerHTML = head;
      el("strip-next").innerHTML = renderCells(lower);
    }

    function screenNow() { return store ? initialScreen(store) : "storage-error"; }

    function savedUrl() {
      var u = store ? getSavedUrl(store) : null;
      return u && isValidExecUrl(u) ? compactUrl(u) : null;
    }

    function paintList() {
      var scr = screenNow();
      if (scr === "storage-error") {
        el("setup").className = "off";
        el("lista").innerHTML = '<p class="msg"><b>Pami\u0119\u0107 przegl\u0105darki niedost\u0119pna</b>' +
          "Wy\u0142\u0105cz tryb prywatny w Safari.</p>";
        return;
      }
      var setup = scr === "setup" || showSetup;
      el("setup").className = setup ? "" : "off";
      el("lista").innerHTML = setup ? "" : listsHtml(ls, LIST_MAX_ROWS) +
        '<p class="list-foot"><span class="link" data-act="setup">zmie\u0144 adres</span></p>';
    }

    function fetchList() {
      var url = savedUrl();
      if (!url || listBusy) { paintList(); return; }
      listBusy = true;
      jsonpRequest(env, url, {}, function (res) {
        listBusy = false;
        onFetchResult(ls, res);
        paintList();
      });
    }

    function tick(list, row) {
      var url = savedUrl();
      if (!url) return;
      var r = tickStart(ls, list, row);
      paintList();
      if (!r.request) return;
      jsonpRequest(env, url, r.request, function (res) {
        tickResult(ls, list, row, !!(res && res.ok === true));
        paintList();
      });
    }

    function act(name) {
      if (name === "setup") { showSetup = true; }
      if (name === "clear") { el("setup-url").value = ""; el("setup-err").innerHTML = ""; }
      if (name === "save") {
        var v = el("setup-url").value;
        if (!isValidExecUrl(v)) {
          el("setup-err").innerHTML = "To nie jest adres \u2026/exec?key=\u2026 &mdash; sprawd\u017a, czy skopiowa\u0142a\u015b ca\u0142o\u015b\u0107.";
          return;
        }
        if (!saveUrl(store, v)) {
          el("setup-err").innerHTML = "Nie da si\u0119 zapisa\u0107 &mdash; wy\u0142\u0105cz tryb prywatny w Safari.";
          return;
        }
        el("setup-url").value = "";
        el("setup-err").innerHTML = "";
        showSetup = false;
        ls = createListState();
        fetchList();
      }
      paintList();
    }

    /* nearest element (itself or a parent) carrying the attribute */
    function withAttr(t, name) {
      while (t && t.getAttribute) {
        if (t.getAttribute(name) !== null) return t;
        t = t.parentNode;
      }
      return null;
    }

    /* every render replaces innerHTML; nothing is ever appended */
    function apply() {
      var now = new Date();
      var d0 = decide(state, now, sunriseIso());
      rotate(state, now, d0.rotating);
      var d = decide(state, now, sunriseIso());
      var i;
      for (i = 0; i < VIEWS.length; i++) {
        el("view-" + VIEWS[i].id).className = "view" + (VIEWS[i].id === d.view ? " on" : "");
      }
      el("tabs").innerHTML = tabsHtml(d.view);

      /* header shows the dropdown on the weather view, the mini bar elsewhere */
      var onWeather = d.view === "pogoda";
      el("range").className = onWeather ? "" : "off";
      el("mini").className = onWeather ? "" : "on";
      el("mini").innerHTML = onWeather ? "" : miniNowHtml(cache);
      document.body.className = bodyClass(theme, d.dark);
      el("theme").innerHTML = themeIcon(theme);
      el("night").className = d.dark ? "on" : "";
      if (d.view === "pogoda") paintWeather();
      var prevView = lastView;
      lastView = d.view;
      if (prevView === "lista" && d.view !== "lista") showSetup = false;
      if (d.view === "lista") {
        collapseIfIdle(ls, state, new Date());
        if (needsFetch(prevView, d.view)) fetchList(); else paintList();
      }
      schedule(d);
    }

    /* aims one timer at the fixed deadline; re-arming it never moves the deadline */
    function schedule(d) {
      if (rotTimer) { clearTimeout(rotTimer); rotTimer = null; }
      if (!d.rotating || !state.switchAt) return;
      rotTimer = setTimeout(function () { apply(); },
        Math.max(0, state.switchAt - new Date().getTime()) + 50);
    }

    /* one timer re-armed, never stacked */
    function armWindow(ms) {
      if (winTimer) { clearTimeout(winTimer); winTimer = null; }
      winTimer = setTimeout(function () { apply(); }, ms + 500);
    }

    function touched(viewId) {
      var now = new Date();
      if (viewId && viewId !== currentView(state)) {
        while (currentView(state) !== viewId) advance(state);
        onTouch(state, now, sunriseIso());
      } else {
        onTouch(state, now, sunriseIso());
      }
      armWindow(isDark(now, sunriseIso()) ? WAKE_MS : PAUSE_MS);
      apply();
    }

    /* keeps the last good weather on screen if there is one; the retry never stacks */
    function fail(reason) {
      el("stamp").innerHTML = "brak po\u0142\u0105czenia" +
        (cache ? " \u2014 dane z wcze\u015bniej" : "");
      if (!cache) {
        el("now").innerHTML = "";
        el("strip-today").innerHTML = "";
        el("strip-next").innerHTML = "";
        el("msg-today").innerHTML = '<p class="msg"><b>Nie uda\u0142o si\u0119 pobra\u0107 pogody</b>' +
          reason + " Kolejna pr\u00f3ba za minut\u0119.</p>";
      }
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      retryTimer = setTimeout(load, 60000);
    }

    function load() {
      var x = new XMLHttpRequest();
      x.open("GET", API + "&_=" + new Date().getTime(), true);
      x.timeout = 15000;
      x.onload = function () {
        if (x.status !== 200) { fail("Serwer pogodowy odpowiedzia\u0142 b\u0142\u0119dem " + x.status + "."); return; }
        var parsed;
        try { parsed = JSON.parse(x.responseText); }
        catch (e) { fail("Odpowied\u017a serwera by\u0142a nieczytelna."); return; }
        if (!parsed || !parsed.daily || !parsed.current) {
          fail("Odpowied\u017a serwera by\u0142a niekompletna."); return;
        }
        cache = parsed;
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        el("stamp").innerHTML = "aktualizacja " + localIso().slice(11, 16);
        apply();
      };
      x.onerror = function () { fail("Sprawd\u017a Wi-Fi."); };
      x.ontimeout = function () { fail("Serwer nie odpowiedzia\u0142 na czas."); };
      x.send();
    }

    el("range").onchange = function () { touched(null); };

    document.getElementById("theme").onclick = function (e) {
      theme = nextTheme(theme);
      saveTheme(store, theme);
      touched(null);
      if (e && e.stopPropagation) e.stopPropagation();
    };

    document.getElementById("app").onclick = function (e) {
      var t = e.target;
      if (t && t.id === "theme") return;
      var a = withAttr(t, "data-act");
      var item = withAttr(t, "data-row");
      var more = withAttr(t, "data-list");
      if (a) { touched(null); act(a.getAttribute("data-act")); return; }
      if (item) {
        touched(null);
        tick(item.getAttribute("data-list"), Number(item.getAttribute("data-row")));
        return;
      }
      if (more) { expandList(ls, more.getAttribute("data-list")); touched(null); return; }
      var id = t && t.getAttribute ? t.getAttribute("data-view") : null;
      touched(id);
    };
    document.getElementById("night").onclick = function () { touched(null); };

    /* re-evaluate at 00:30 and at dawn without a busy loop */
    setInterval(function () { apply(); }, 60000);

    setInterval(load, 900000);

    setTimeout(function () {
      var base = location.href.split("?")[0].split("#")[0];
      location.replace(base + "?v=" + new Date().getTime());
    }, msUntil4am(new Date()));

    apply();
    load();
  })();
}

if (typeof module !== "undefined") {
  module.exports = {
    wmo: wmo, buildDaily: buildDaily,
    buildToday: buildToday, buildTomorrow: buildTomorrow, hourCell: hourCell,
    msUntil4am: msUntil4am,
    cellHtml: cellHtml, nowHtml: nowHtml, dayLabel: dayLabel,
    VIEWS: VIEWS, PAUSE_MS: PAUSE_MS, WAKE_MS: WAKE_MS,
    createState: createState, currentView: currentView, advance: advance, rotate: rotate,
    decide: decide, onTouch: onTouch, onManualSwitch: onManualSwitch,
    themeIcon: themeIcon, nextTheme: nextTheme, readTheme: readTheme,
    saveTheme: saveTheme, bodyClass: bodyClass, THEMES: THEMES,
    isDark: isDark, dawnTime: dawnTime, dawnToday: dawnToday, dimStart: dimStart,
    tabsHtml: tabsHtml, miniNowHtml: miniNowHtml,
    STORAGE_KEY: STORAGE_KEY, JSONP_TIMEOUT_MS: JSONP_TIMEOUT_MS, LISTS: LISTS,
    isValidExecUrl: isValidExecUrl, compactUrl: compactUrl, getSavedUrl: getSavedUrl, saveUrl: saveUrl,
    initialScreen: initialScreen, escapeHtml: escapeHtml,
    createListState: createListState, needsFetch: needsFetch,
    onFetchResult: onFetchResult, tickStart: tickStart, tickResult: tickResult,
    expandList: expandList, collapseIfIdle: collapseIfIdle, listsHtml: listsHtml,
    buildJsonpUrl: buildJsonpUrl, jsonpRequest: jsonpRequest
  };
}
</script>
</body>
</html>
