<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Panel</title>
<style>
html, body {
  margin: 0; padding: 0; height: 100%;
  background-color: #10161f;
  color: #e8eef6;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  overflow: hidden;
}

#app { box-sizing: border-box; height: 100%; padding: 20px 26px 14px 26px; }

/* ---------- top bar ---------- */
.top {
  display: -webkit-box; display: flex;
  -webkit-box-align: start; align-items: flex-start;
  -webkit-box-pack: justify; justify-content: space-between;
}
.place { font-size: 22px; font-weight: 300; letter-spacing: 0.12em; color: #7d92ab; margin: 0 0 2px 0; }
.stamp { font-size: 15px; color: #56687d; margin: 0; }

/* ---------- view tabs ---------- */
#tabs { display: -webkit-box; display: flex; }
.tab {
  font-size: 17px; color: #6f8299;
  padding: 8px 15px; margin-left: 7px;
  background-color: #17202c; border-radius: 7px;
  border-top: 2px solid #2b3a4d;
}
.tab.on { color: #e8eef6; border-top-color: #ffc46b; background-color: #1d2735; }

#mini {
  display: none;
  font-size: 21px; font-weight: 300; color: #b9c9db;
  margin-top: 11px; white-space: nowrap;
}
#mini.on { display: inline; }
#mini i { font-style: normal; font-size: 24px; margin-right: 8px; }
#mini b { font-weight: 400; color: #ffc46b; font-size: 27px; margin-right: 10px; }
#mini u { text-decoration: none; color: #7d92ab; font-size: 17px; margin-left: 10px; }

select {
  font-family: inherit; font-size: 15px; color: #b9c9db;
  background-color: #1a2330; border: 1px solid #2b3a4d;
  border-radius: 6px; padding: 4px 7px;
  -webkit-appearance: none; appearance: none;
  min-width: 0; width: auto; margin-top: 7px;
}
select.off { display: none; }

/* ---------- views ---------- */
.view { display: none; }
.view.on { display: block; }

/* ---------- weather ---------- */
.now { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; margin: 10px 0 16px 0; }
.now-icon { font-size: 76px; line-height: 1; margin-right: 22px; }
.now-temp { font-size: 104px; font-weight: 200; line-height: 0.92; color: #ffc46b; margin-right: 26px; }
.now-text { font-size: 28px; font-weight: 300; line-height: 1.35; color: #b9c9db; }
.now-text span { color: #7d92ab; font-size: 21px; }

#strip-today, #strip-next { display: -webkit-box; display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
.cell {
  -webkit-box-flex: 1; flex: 1 0 auto; min-width: 104px;
  text-align: center; padding: 16px 9px 18px 9px; margin-right: 10px;
  background-color: #17202c; border-radius: 9px; border-top: 2px solid #2b3a4d;
}
.cell:last-child { margin-right: 0; }
.cell.edge { border-top-color: #ffc46b; }
.c-when { font-size: 19px; color: #8fa3b8; margin-bottom: 10px; }
.c-icon { font-size: 34px; line-height: 1; margin-bottom: 10px; }
.c-temp { font-size: 31px; font-weight: 300; color: #ffc46b; margin-bottom: 2px; }
.c-lo { font-size: 22px; color: #6f8299; margin-bottom: 10px; }
.c-rain { font-size: 18px; color: #6fb6f0; margin-bottom: 5px; }
.c-wind { font-size: 18px; color: #7d92ab; }

/* ---------- stubs ---------- */
.stub { margin-top: 40px; font-size: 24px; font-weight: 300; line-height: 1.6; color: #6f8299; }
.stub b { display: block; font-weight: 400; font-size: 30px; color: #b9c9db; margin-bottom: 10px; }

.strip-head {
  font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #6f8299; margin: 10px 0 9px 0;
}
.msg { margin-top: 30px; font-size: 22px; font-weight: 300; line-height: 1.5; color: #8fa3b8; }
.msg b { display: block; font-weight: 400; color: #e8eef6; margin-bottom: 6px; }

/* ---------- night ---------- */
#night {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-color: #000;
  display: none;
}
#night.on { display: block; }
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div>
      <p class="place" id="place">Lublin</p>
      <p class="stamp" id="stamp">Wczytywanie...</p>
      <span id="mini"></span>
      <select id="range">
        <option value="tomorrow">Jutro</option>
        <option value="3">3 dni</option>
        <option value="5">5 dni</option>
        <option value="7">7 dni</option>
      </select>
    </div>
    <div id="tabs"></div>
  </div>

  <div class="view" id="view-pogoda">
    <div id="now"></div>
    <p class="strip-head" id="head-today">Dzisiaj</p>
    <div id="strip-today"></div>
    <div id="msg-today"></div>
    <p class="strip-head" id="head-next">Jutro</p>
    <div id="strip-next"></div>
  </div>

  <div class="view" id="view-lista">
    <p class="stub"><b>Zakupy / ToDo</b>Etap C &mdash; pozycje z arkusza, odhaczane palcem.</p>
  </div>

  <div class="view" id="view-kalendarz">
    <p class="stub"><b>Kalendarz</b>Etap B &mdash; wydarzenia na dzi&#347; ze wsp&#243;lnego kalendarza.</p>
  </div>
</div>

<div id="night"></div>

<script>
var LAT = 51.2465;
var LON = 22.5684;

var API = "https://api.open-meteo.com/v1/forecast" +
  "?latitude=" + LAT + "&longitude=" + LON +
  "&current=temperature_2m,weather_code,wind_speed_10m,precipitation" +
  "&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m" +
  "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
  "precipitation_probability_max,wind_speed_10m_max,sunrise,sunset" +
  "&timezone=Europe%2FWarsaw&forecast_days=8";

var DNI = ["niedziela", "poniedzia\u0142ek", "wtorek", "\u015broda",
           "czwartek", "pi\u0105tek", "sobota"];

/* rotation plan: weather gets half the loop */
var VIEWS = [
  { id: "pogoda",    label: "Pogoda",       ms: 600000 },
  { id: "lista",     label: "Zakupy/ToDo",  ms: 300000 },
  { id: "kalendarz", label: "Kalendarz",    ms: 300000 }
];

var PAUSE_MS = 300000;   /* touch in daytime holds the view */
var WAKE_MS  = 30000;    /* touch at night lights the screen */
var DIM_MIN  = 30;       /* screen goes dark at 00:30 */
var DAWN_LEAD_MS = 300000; /* lights up 5 min before sunrise */

/* ---------- weather logic (unchanged from v1) ---------- */

function wmo(code) {
  if (code === 0) return { icon: "\u2600\uFE0F", text: "bezchmurnie" };
  if (code === 1) return { icon: "\uD83C\uDF24", text: "prawie bezchmurnie" };
  if (code === 2) return { icon: "\u26C5", text: "cz\u0119\u015bciowe zachmurzenie" };
  if (code === 3) return { icon: "\u2601\uFE0F", text: "pochmurno" };
  if (code === 45 || code === 48) return { icon: "\uD83C\uDF2B", text: "mg\u0142a" };
  if (code >= 51 && code <= 57) return { icon: "\uD83C\uDF26", text: "mrzawka" };
  if (code >= 61 && code <= 65) return { icon: "\uD83C\uDF27", text: "deszcz" };
  if (code === 66 || code === 67) return { icon: "\uD83C\uDF27", text: "marzn\u0105cy deszcz" };
  if (code >= 71 && code <= 77) return { icon: "\u2744\uFE0F", text: "\u015bnieg" };
  if (code >= 80 && code <= 82) return { icon: "\uD83C\uDF26", text: "przelotny deszcz" };
  if (code === 85 || code === 86) return { icon: "\uD83C\uDF28", text: "opady \u015bniegu" };
  if (code >= 95) return { icon: "\u26C8", text: "burza" };
  return { icon: "\uD83C\uDF21", text: "brak danych" };
}

function hhmm(iso) { return iso.slice(11, 16); }

function dayLabel(iso, todayIso) {
  if (iso.slice(0, 10) === todayIso.slice(0, 10)) return "dzisiaj";
  var p = iso.slice(0, 10).split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return DNI[d.getDay()];
}

function round(n) {
  if (n === null || n === undefined || isNaN(n)) return null;
  return Math.round(n);
}

/* daily strip starts at TOMORROW: today already has its own hourly strip above */
function buildDaily(data, count, todayIso) {
  var d = data.daily, out = [], i;
  for (i = 1; i <= count && i < d.time.length; i++) {
    out.push({
      when: dayLabel(d.time[i], todayIso),
      icon: wmo(d.weather_code[i]).icon,
      text: wmo(d.weather_code[i]).text,
      temp: round(d.temperature_2m_max[i]),
      lo: round(d.temperature_2m_min[i]),
      rain: round(d.precipitation_probability_max[i]),
      wind: round(d.wind_speed_10m_max[i]),
      edge: false
    });
  }
  return out;
}

/* today: from the current hour through 23:00. Past hours are dropped, not dimmed.
   Sunrise/sunset no longer bound this strip - they only drive night mode. */
function buildToday(data, nowIso) {
  var h = data.hourly;
  var day = nowIso.slice(0, 10);
  var fromHour = nowIso.slice(0, 13) + ":00";
  var out = [], i;
  for (i = 0; i < h.time.length; i++) {
    var t = h.time[i];
    if (t.slice(0, 10) !== day) continue;
    if (t < fromHour) continue;
    out.push(hourCell(h, i));
  }
  return out;
}

/* tomorrow: from tomorrow's own sunrise through 23:00 */
function buildTomorrow(data) {
  var h = data.hourly;
  if (!data.daily.sunrise[1]) return [];
  var sunrise = data.daily.sunrise[1];
  var day = sunrise.slice(0, 10);
  var fromHour = sunrise.slice(0, 13) + ":00";
  var out = [], i;
  for (i = 0; i < h.time.length; i++) {
    var t = h.time[i];
    if (t.slice(0, 10) !== day) continue;
    if (t < fromHour) continue;
    out.push(hourCell(h, i));
  }
  return out;
}

function hourCell(h, i) {
  return {
    when: hhmm(h.time[i]),
    icon: wmo(h.weather_code[i]).icon,
    text: wmo(h.weather_code[i]).text,
    temp: round(h.temperature_2m[i]),
    lo: null,
    rain: round(h.precipitation_probability[i]),
    wind: round(h.wind_speed_10m[i]),
    edge: false
  };
}

function msUntil4am(now) {
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0, 0);
  if (t.getTime() <= now.getTime()) {
    t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 4, 0, 0, 0);
  }
  return t.getTime() - now.getTime();
}

/* ---------- night mode ---------- */

function parseLocal(iso) {
  var d = iso.slice(0, 10).split("-");
  var t = iso.slice(11, 16).split(":");
  return new Date(Number(d[0]), Number(d[1]) - 1, Number(d[2]),
                  Number(t[0]), Number(t[1]), 0, 0);
}

/* lights up DAWN_LEAD_MS before whatever sunrise the API reported */
function dawnTime(sunriseIso) {
  return new Date(parseLocal(sunriseIso).getTime() - DAWN_LEAD_MS);
}

function dimStart(now) {
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, DIM_MIN, 0, 0);
}

/* the dark window always belongs to ONE calendar day: 00:30 -> dawn that morning.
   The API's sunrise may carry a different date (cached, or already tomorrow's),
   so only its clock time is used, pinned to the day we are actually in. */
function dawnToday(now, sunriseIso) {
  var t = sunriseIso.slice(11, 16).split(":");
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                   Number(t[0]), Number(t[1]), 0, 0);
  return new Date(d.getTime() - DAWN_LEAD_MS);
}

function isDark(now, sunriseIso) {
  var dawn = dawnToday(now, sunriseIso);
  var dim = dimStart(now);
  if (now.getTime() < dim.getTime()) return false;
  return now.getTime() < dawn.getTime();
}

/* ---------- state machine ---------- */

function createState() {
  return { viewIndex: 0, pausedUntil: 0, wakeUntil: 0 };
}

function currentView(state) { return VIEWS[state.viewIndex].id; }

function advance(state) {
  state.viewIndex = (state.viewIndex + 1) % VIEWS.length;
  return VIEWS[state.viewIndex];
}

/* single source of truth for what the screen should be doing right now */
function decide(state, now, sunriseIso) {
  var ms = now.getTime();
  var dark = isDark(now, sunriseIso);
  if (dark) {
    var awake = ms < state.wakeUntil;
    return { view: currentView(state), dark: !awake, rotating: false, night: true };
  }
  var paused = ms < state.pausedUntil;
  return { view: currentView(state), dark: false, rotating: !paused, night: false };
}

function onTouch(state, now, sunriseIso) {
  if (isDark(now, sunriseIso)) {
    state.wakeUntil = now.getTime() + WAKE_MS;   /* reset, not extend-by-sum */
  } else {
    state.pausedUntil = now.getTime() + PAUSE_MS;
  }
  return state;
}

function onManualSwitch(state, now, sunriseIso) {
  advance(state);
  return onTouch(state, now, sunriseIso);
}

/* ---------- rendering ---------- */

function cellHtml(c) {
  var s = "";
  s += '<div class="cell' + (c.edge ? " edge" : "") + '"' +
       (c.past ? ' style="opacity:0.42"' : "") + ">";
  s += '<div class="c-when">' + c.when + "</div>";
  s += '<div class="c-icon">' + c.icon + "</div>";
  s += '<div class="c-temp">' + (c.temp === null ? "--" : c.temp + "\u00B0") + "</div>";
  s += '<div class="c-lo">' + (c.lo === null ? "&nbsp;" : c.lo + "\u00B0") + "</div>";
  s += '<div class="c-rain">\uD83D\uDCA7 ' + (c.rain === null ? "--" : c.rain + "%") + "</div>";
  s += '<div class="c-wind">\uD83D\uDCA8 ' + (c.wind === null ? "--" : c.wind + " km/h") + "</div>";
  s += "</div>";
  return s;
}

function nowHtml(data) {
  var c = data.current;
  var w = wmo(c.weather_code);
  var s = '<div class="now">';
  s += '<div class="now-icon">' + w.icon + "</div>";
  s += '<div class="now-temp">' + round(c.temperature_2m) + "\u00B0</div>";
  s += '<div class="now-text">' + w.text + "<br>";
  s += "<span>wiatr " + round(c.wind_speed_10m) + " km/h";
  s += " &nbsp; opad " + c.precipitation + " mm</span>";
  s += "</div></div>";
  return s;
}

/* compact one-line version of the current conditions, for the header.
   Inline elements only - it must never become a second block. */
function miniNowHtml(data) {
  if (!data || !data.current) {
    return "<i>\uD83C\uDF21</i><b>--\u00B0</b>brak danych";
  }
  var c = data.current;
  var w = wmo(c.weather_code);
  var temp = round(c.temperature_2m);
  var wind = round(c.wind_speed_10m);
  var rain = (c.precipitation === null || c.precipitation === undefined)
    ? "--" : c.precipitation;
  return "<i>" + w.icon + "</i>" +
         "<b>" + (temp === null ? "--" : temp) + "\u00B0</b>" +
         w.text +
         "<u>\uD83D\uDCA8 " + (wind === null ? "--" : wind) + " km/h" +
         " &nbsp; \uD83D\uDCA7 " + rain + " mm</u>";
}

function tabsHtml(activeId) {
  var s = "", i;
  for (i = 0; i < VIEWS.length; i++) {
    s += '<div class="tab' + (VIEWS[i].id === activeId ? " on" : "") +
         '" data-view="' + VIEWS[i].id + '">' + VIEWS[i].label + "</div>";
  }
  return s;
}

/* ---------- wiring ---------- */

if (typeof document !== "undefined") {
  (function () {
    var cache = null;
    var state = createState();
    var rotTimer = null;   /* exactly one rotation timer ever exists */
    var winTimer = null;   /* exactly one pause/wake timer ever exists */

    function el(id) { return document.getElementById(id); }

    function localIso() {
      var d = new Date();
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
             "T" + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function sunriseIso() {
      if (cache && cache.daily && cache.daily.sunrise) return cache.daily.sunrise[0];
      var d = new Date();
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T06:00";
    }

    function renderCells(cells) {
      var html = "", i;
      for (i = 0; i < cells.length; i++) html += cellHtml(cells[i]);
      return html;
    }

    function paintWeather() {
      if (!cache) return;
      var nowIso = localIso();

      el("now").innerHTML = nowHtml(cache);

      /* upper strip: today, independent of the dropdown */
      var today = buildToday(cache, nowIso);
      el("strip-today").innerHTML = renderCells(today);
      el("msg-today").innerHTML = today.length === 0
        ? '<p class="msg">Dzi\u015b nie ma ju\u017c pe\u0142nych godzin do pokazania.</p>'
        : "";

      /* lower strip: whatever the dropdown selects */
      var mode = el("range").value;
      var lower, head;
      if (mode === "tomorrow") {
        lower = buildTomorrow(cache);
        head = "Jutro";
      } else {
        lower = buildDaily(cache, Number(mode), nowIso);
        head = "Najbli\u017cszych " + mode + " dni";
      }
      el("head-next").innerHTML = head;
      el("strip-next").innerHTML = renderCells(lower);
    }

    /* every render replaces innerHTML; nothing is ever appended */
    function apply() {
      var d = decide(state, new Date(), sunriseIso());
      var i;
      for (i = 0; i < VIEWS.length; i++) {
        el("view-" + VIEWS[i].id).className = "view" + (VIEWS[i].id === d.view ? " on" : "");
      }
      el("tabs").innerHTML = tabsHtml(d.view);

      /* header shows the dropdown on the weather view, the mini bar elsewhere */
      var onWeather = d.view === "pogoda";
      el("range").className = onWeather ? "" : "off";
      el("mini").className = onWeather ? "" : "on";
      el("mini").innerHTML = onWeather ? "" : miniNowHtml(cache);
      el("night").className = d.dark ? "on" : "";
      if (d.view === "pogoda") paintWeather();
      schedule(d);
    }

    function schedule(d) {
      if (rotTimer) { clearTimeout(rotTimer); rotTimer = null; }
      if (!d.rotating) return;
      rotTimer = setTimeout(function () {
        advance(state);
        apply();
      }, VIEWS[state.viewIndex].ms);
    }

    /* one timer re-armed, never stacked */
    function armWindow(ms) {
      if (winTimer) { clearTimeout(winTimer); winTimer = null; }
      winTimer = setTimeout(function () { apply(); }, ms + 500);
    }

    function touched(viewId) {
      var now = new Date();
      if (viewId && viewId !== currentView(state)) {
        while (currentView(state) !== viewId) advance(state);
        onTouch(state, now, sunriseIso());
      } else {
        onTouch(state, now, sunriseIso());
      }
      armWindow(isDark(now, sunriseIso()) ? WAKE_MS : PAUSE_MS);
      apply();
    }

    function fail(reason) {
      el("stamp").innerHTML = "brak po\u0142\u0105czenia";
      el("now").innerHTML = "";
      el("strip").innerHTML = "";
      el("msg").innerHTML = '<p class="msg"><b>Nie uda\u0142o si\u0119 pobra\u0107 pogody</b>' +
        reason + " Kolejna pr\u00f3ba za minut\u0119.</p>";
      setTimeout(load, 60000);
    }

    function load() {
      var x = new XMLHttpRequest();
      x.open("GET", API + "&_=" + new Date().getTime(), true);
      x.timeout = 15000;
      x.onload = function () {
        if (x.status !== 200) { fail("Serwer pogodowy odpowiedzia\u0142 b\u0142\u0119dem " + x.status + "."); return; }
        var parsed;
        try { parsed = JSON.parse(x.responseText); }
        catch (e) { fail("Odpowied\u017a serwera by\u0142a nieczytelna."); return; }
        if (!parsed || !parsed.daily || !parsed.current) {
          fail("Odpowied\u017a serwera by\u0142a niekompletna."); return;
        }
        cache = parsed;
        el("stamp").innerHTML = "aktualizacja " + localIso().slice(11, 16);
        apply();
      };
      x.onerror = function () { fail("Sprawd\u017a Wi-Fi."); };
      x.ontimeout = function () { fail("Serwer nie odpowiedzia\u0142 na czas."); };
      x.send();
    }

    el("range").onchange = function () { touched(null); };

    document.getElementById("app").onclick = function (e) {
      var t = e.target;
      var id = t && t.getAttribute ? t.getAttribute("data-view") : null;
      touched(id);
    };
    document.getElementById("night").onclick = function () { touched(null); };

    /* re-evaluate at 00:30 and at dawn without a busy loop */
    setInterval(function () { apply(); }, 60000);

    setInterval(load, 900000);

    setTimeout(function () {
      var base = location.href.split("?")[0].split("#")[0];
      location.replace(base + "?v=" + new Date().getTime());
    }, msUntil4am(new Date()));

    apply();
    load();
  })();
}

if (typeof module !== "undefined") {
  module.exports = {
    wmo: wmo, buildDaily: buildDaily,
    buildToday: buildToday, buildTomorrow: buildTomorrow, hourCell: hourCell,
    msUntil4am: msUntil4am,
    cellHtml: cellHtml, nowHtml: nowHtml, dayLabel: dayLabel,
    VIEWS: VIEWS, PAUSE_MS: PAUSE_MS, WAKE_MS: WAKE_MS,
    createState: createState, currentView: currentView, advance: advance,
    decide: decide, onTouch: onTouch, onManualSwitch: onManualSwitch,
    isDark: isDark, dawnTime: dawnTime, dawnToday: dawnToday, dimStart: dimStart,
    tabsHtml: tabsHtml, miniNowHtml: miniNowHtml
  };
