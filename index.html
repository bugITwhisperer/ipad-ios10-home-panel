<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pogoda">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pogoda</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: #10161f;
  color: #e8eef6;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  overflow: hidden;
}

#app {
  box-sizing: border-box;
  height: 100%;
  padding: 26px 30px 20px 30px;
}

/* ---------- top bar ---------- */
.top {
  display: -webkit-box;
  display: flex;
  -webkit-box-align: start;
  align-items: flex-start;
  -webkit-box-pack: justify;
  justify-content: space-between;
}

.place {
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: #7d92ab;
  margin: 0 0 2px 0;
}

.stamp {
  font-size: 15px;
  color: #56687d;
  margin: 0;
}

select {
  font-family: inherit;
  font-size: 19px;
  color: #e8eef6;
  background-color: #1d2735;
  border: 1px solid #33455c;
  border-radius: 7px;
  padding: 9px 13px;
  -webkit-appearance: none;
  appearance: none;
  min-width: 165px;
}

/* ---------- now ---------- */
.now {
  display: -webkit-box;
  display: flex;
  -webkit-box-align: center;
  align-items: center;
  margin: 14px 0 20px 0;
}

.now-icon {
  font-size: 74px;
  line-height: 1;
  margin-right: 24px;
}

.now-temp {
  font-size: 96px;
  font-weight: 200;
  line-height: 0.92;
  color: #ffc46b;
  margin-right: 28px;
}

.now-text {
  font-size: 25px;
  font-weight: 300;
  line-height: 1.35;
  color: #b9c9db;
}

.now-text span {
  color: #7d92ab;
  font-size: 19px;
}

/* ---------- strip ---------- */
#strip {
  display: -webkit-box;
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}

.cell {
  -webkit-box-flex: 1;
  flex: 1 0 auto;
  min-width: 96px;
  text-align: center;
  padding: 15px 8px 17px 8px;
  margin-right: 9px;
  background-color: #17202c;
  border-radius: 9px;
  border-top: 2px solid #2b3a4d;
}

.cell:last-child { margin-right: 0; }

.cell.edge { border-top-color: #ffc46b; }

.c-when {
  font-size: 17px;
  color: #7d92ab;
  margin-bottom: 8px;
}

.c-icon {
  font-size: 31px;
  line-height: 1;
  margin-bottom: 8px;
}

.c-temp {
  font-size: 27px;
  font-weight: 300;
  color: #ffc46b;
  margin-bottom: 2px;
}

.c-lo {
  font-size: 19px;
  color: #6f8299;
  margin-bottom: 8px;
}

.c-rain {
  font-size: 16px;
  color: #6fb6f0;
  margin-bottom: 3px;
}

.c-wind {
  font-size: 16px;
  color: #7d92ab;
}

/* ---------- states ---------- */
.msg {
  margin-top: 34px;
  font-size: 23px;
  font-weight: 300;
  line-height: 1.5;
  color: #8fa3b8;
}

.msg b {
  display: block;
  font-weight: 400;
  color: #e8eef6;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<div id="app">
  <div class="top">
    <div>
      <p class="place" id="place">Lublin</p>
      <p class="stamp" id="stamp">Wczytywanie...</p>
    </div>
    <select id="range">
      <option value="today">Dzisiaj, godzinowo</option>
      <option value="3">Najbli&#380;sze 3 dni</option>
      <option value="5">Najbli&#380;sze 5 dni</option>
    </select>
  </div>

  <div id="now"></div>
  <div id="strip"></div>
  <div id="msg"></div>
</div>

<script>
var LAT = 51.2465;
var LON = 22.5684;

var API = "https://api.open-meteo.com/v1/forecast" +
  "?latitude=" + LAT + "&longitude=" + LON +
  "&current=temperature_2m,weather_code,wind_speed_10m,precipitation" +
  "&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m" +
  "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
  "precipitation_probability_max,wind_speed_10m_max,sunrise,sunset" +
  "&timezone=Europe%2FWarsaw&forecast_days=6";

var DNI = ["niedziela", "poniedzia\u0142ek", "wtorek", "\u015broda",
           "czwartek", "pi\u0105tek", "sobota"];

/* ---------- pure logic ---------- */

function wmo(code) {
  if (code === 0) return { icon: "\u2600\uFE0F", text: "bezchmurnie" };
  if (code === 1) return { icon: "\uD83C\uDF24", text: "prawie bezchmurnie" };
  if (code === 2) return { icon: "\u26C5", text: "cz\u0119\u015bciowe zachmurzenie" };
  if (code === 3) return { icon: "\u2601\uFE0F", text: "pochmurno" };
  if (code === 45 || code === 48) return { icon: "\uD83C\uDF2B", text: "mg\u0142a" };
  if (code >= 51 && code <= 57) return { icon: "\uD83C\uDF26", text: "mrzawka" };
  if (code >= 61 && code <= 65) return { icon: "\uD83C\uDF27", text: "deszcz" };
  if (code === 66 || code === 67) return { icon: "\uD83C\uDF27", text: "marzn\u0105cy deszcz" };
  if (code >= 71 && code <= 77) return { icon: "\u2744\uFE0F", text: "\u015bnieg" };
  if (code >= 80 && code <= 82) return { icon: "\uD83C\uDF26", text: "przelotny deszcz" };
  if (code === 85 || code === 86) return { icon: "\uD83C\uDF28", text: "opady \u015bniegu" };
  if (code >= 95) return { icon: "\u26C8", text: "burza" };
  return { icon: "\uD83C\uDF21", text: "brak danych" };
}

function hhmm(iso) {
  return iso.slice(11, 16);
}

function dayLabel(iso, todayIso) {
  if (iso.slice(0, 10) === todayIso.slice(0, 10)) return "dzisiaj";
  var p = iso.slice(0, 10).split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return DNI[d.getDay()];
}

function round(n) {
  if (n === null || n === undefined || isNaN(n)) return null;
  return Math.round(n);
}

function buildDaily(data, count, todayIso) {
  var d = data.daily;
  var out = [];
  var i;
  for (i = 0; i < count && i < d.time.length; i++) {
    out.push({
      when: dayLabel(d.time[i], todayIso),
      icon: wmo(d.weather_code[i]).icon,
      text: wmo(d.weather_code[i]).text,
      temp: round(d.temperature_2m_max[i]),
      lo: round(d.temperature_2m_min[i]),
      rain: round(d.precipitation_probability_max[i]),
      wind: round(d.wind_speed_10m_max[i]),
      edge: false
    });
  }
  return out;
}

function buildHourly(data, nowIso) {
  var h = data.hourly;
  var sunrise = data.daily.sunrise[0];
  var sunset = data.daily.sunset[0];
  var out = [];
  var i;
  for (i = 0; i < h.time.length; i++) {
    var t = h.time[i];
    if (t.slice(0, 10) !== nowIso.slice(0, 10)) continue;
    if (t < sunrise.slice(0, 13) + ":00") continue;
    if (t > sunset) continue;
    out.push({
      when: hhmm(t),
      icon: wmo(h.weather_code[i]).icon,
      text: wmo(h.weather_code[i]).text,
      temp: round(h.temperature_2m[i]),
      lo: null,
      rain: round(h.precipitation_probability[i]),
      wind: round(h.wind_speed_10m[i]),
      edge: false,
      past: t < nowIso.slice(0, 13) + ":00"
    });
  }
  var future = 0;
  for (i = 0; i < out.length; i++) if (!out[i].past) future++;
  if (future === 0) return [];

  if (out.length > 0) {
    out[0].edge = true;
    out[out.length - 1].edge = true;
  }
  return out;
}

function emptyHourlyMessage(data, nowIso) {
  var sunset = data.daily.sunset[0];
  if (nowIso > sunset) {
    return {
      head: "S\u0142o\u0144ce ju\u017c zasz\u0142o",
      body: "Dzi\u015b zachodzi\u0142o o " + hhmm(sunset) +
            ". Wybierz 3 lub 5 dni, \u017ceby zobaczy\u0107 prognoz\u0119."
    };
  }
  return {
    head: "Brak godzin do pokazania",
    body: "Spr\u00f3buj widoku 3 lub 5 dni."
  };
}

function msUntil4am(now) {
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0, 0);
  if (t.getTime() <= now.getTime()) {
    t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 4, 0, 0, 0);
  }
  return t.getTime() - now.getTime();
}

/* ---------- rendering ---------- */

function cellHtml(c) {
  var s = "";
  s += '<div class="cell' + (c.edge ? " edge" : "") + '"' +
       (c.past ? ' style="opacity:0.42"' : "") + ">";
  s += '<div class="c-when">' + c.when + "</div>";
  s += '<div class="c-icon">' + c.icon + "</div>";
  s += '<div class="c-temp">' + (c.temp === null ? "--" : c.temp + "\u00B0") + "</div>";
  s += '<div class="c-lo">' + (c.lo === null ? "&nbsp;" : c.lo + "\u00B0") + "</div>";
  s += '<div class="c-rain">\uD83D\uDCA7 ' + (c.rain === null ? "--" : c.rain + "%") + "</div>";
  s += '<div class="c-wind">\uD83D\uDCA8 ' + (c.wind === null ? "--" : c.wind + " km/h") + "</div>";
  s += "</div>";
  return s;
}

function nowHtml(data) {
  var c = data.current;
  var w = wmo(c.weather_code);
  var s = '<div class="now">';
  s += '<div class="now-icon">' + w.icon + "</div>";
  s += '<div class="now-temp">' + round(c.temperature_2m) + "\u00B0</div>";
  s += '<div class="now-text">' + w.text + "<br>";
  s += "<span>wiatr " + round(c.wind_speed_10m) + " km/h";
  s += " &nbsp; opad " + c.precipitation + " mm</span>";
  s += "</div></div>";
  return s;
}

/* ---------- wiring ---------- */

if (typeof document !== "undefined") {
  (function () {
    var cache = null;

    function el(id) { return document.getElementById(id); }

    function localIso() {
      var d = new Date();
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
             "T" + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function paint() {
      if (!cache) return;
      var nowIso = localIso();
      var mode = el("range").value;
      var cells;

      el("now").innerHTML = nowHtml(cache);
      el("msg").innerHTML = "";

      if (mode === "today") {
        cells = buildHourly(cache, nowIso);
        if (cells.length === 0) {
          var m = emptyHourlyMessage(cache, nowIso);
          el("strip").innerHTML = "";
          el("msg").innerHTML = '<p class="msg"><b>' + m.head + "</b>" + m.body + "</p>";
          return;
        }
      } else {
        cells = buildDaily(cache, Number(mode), nowIso);
      }

      var html = "";
      var i;
      for (i = 0; i < cells.length; i++) html += cellHtml(cells[i]);
      el("strip").innerHTML = html;
    }

    function fail(reason) {
      el("stamp").innerHTML = "brak po\u0142\u0105czenia";
      el("now").innerHTML = "";
      el("strip").innerHTML = "";
      el("msg").innerHTML = '<p class="msg"><b>Nie uda\u0142o si\u0119 pobra\u0107 pogody</b>' +
        reason + " Kolejna pr\u00f3ba za minut\u0119.</p>";
      setTimeout(load, 60000);
    }

    function load() {
      var x = new XMLHttpRequest();
      x.open("GET", API + "&_=" + new Date().getTime(), true);
      x.timeout = 15000;
      x.onload = function () {
        if (x.status !== 200) {
          fail("Serwer pogodowy odpowiedzia\u0142 b\u0142\u0119dem " + x.status + ".");
          return;
        }
        var parsed;
        try {
          parsed = JSON.parse(x.responseText);
        } catch (e) {
          fail("Odpowied\u017a serwera by\u0142a nieczytelna.");
          return;
        }
        if (!parsed || !parsed.daily || !parsed.current) {
          fail("Odpowied\u017a serwera by\u0142a niekompletna.");
          return;
        }
        cache = parsed;
        el("stamp").innerHTML = "aktualizacja " + localIso().slice(11, 16);
        paint();
      };
      x.onerror = function () { fail("Sprawd\u017a Wi-Fi."); };
      x.ontimeout = function () { fail("Serwer nie odpowiedzia\u0142 na czas."); };
      x.send();
    }

    el("range").onchange = paint;
    load();
    setInterval(load, 900000);

    setTimeout(function () {
      var base = location.href.split("?")[0].split("#")[0];
      location.replace(base + "?v=" + new Date().getTime());
    }, msUntil4am(new Date()));
  })();
}

if (typeof module !== "undefined") {
  module.exports = {
    wmo: wmo,
    buildDaily: buildDaily,
    buildHourly: buildHourly,
    emptyHourlyMessage: emptyHourlyMessage,
    msUntil4am: msUntil4am,
    cellHtml: cellHtml,
    nowHtml: nowHtml,
    dayLabel: dayLabel
  };
}
</script>
</body>
</html>
